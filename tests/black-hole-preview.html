<header><span>ASTRA · 블랙홀 검수 <span id="status">렌더링 준비 중</span></span><a href="../index.html?v=7#view=blackhole">탐사 화면 열기 ↗</a></header>
<div class="grid"><section class="view"><h2>위에서</h2><p>좌우 밝기 대칭 / 드래그로 시점 변경</p></section><section class="view"><h2>비스듬히</h2><p>뒤쪽 원반의 위·아래 영상</p></section><section class="view"><h2>원반 옆에서</h2><p>휘어 보이는 원반 · 접근/후퇴 쪽 밝기</p></section><section class="view"><h2>아래에서</h2><p>위아래 영상 대칭 · 가까운 거리</p></section></div>
<script type="module">
import * as THREE from 'three';
import { createOpticalRenderer } from '../src/optical-renderer.js?v=7';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { createBlackHoleVisual, createBlackHoleBackground, updateObjectVisual } from '../src/objects.js?v=7';
import { random } from '../src/universe.js';
const status=document.getElementById('status');let errors=0,frames=0,last=0;
const originalError=console.error;console.error=(...args)=>{errors++;status.textContent=`오류 ${errors}개`;originalError(...args)};
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;renderer.setScissorTest(true);document.body.prepend(renderer.domElement);
const optical=location.search.includes('raw')?{render:(scene,camera)=>renderer.render(scene,camera)}:createOpticalRenderer(renderer);
const rng=random('astra-background'),positions=[],colors=[];
for(let i=0;i<1700;i++){const a=rng()*2*Math.PI,z=rng()*2-1,r=Math.sqrt(1-z*z);positions.push(Math.cos(a)*r*2500,z*2500,Math.sin(a)*r*2500);const c=new THREE.Color().setHSL(.55+rng()*.12,.12+rng()*.3,.3+rng()*.5);colors.push(c.r,c.g,c.b)}
const map=createBlackHoleBackground(positions,colors),views=[];
document.querySelectorAll('.view').forEach((element,index)=>{
 const scene=new THREE.Scene();scene.background=new THREE.Color('#02040a');const camera=new THREE.PerspectiveCamera(49,1,.01,1000);camera.position.set(...[[0,48,.01],[0,14,47],[0,2,49],[0,-8,29]][index]);
 const controls=new OrbitControls(camera,element);controls.enablePan=false;controls.enableDamping=true;controls.minDistance=9;controls.maxDistance=80;
 const hole=createBlackHoleVisual(map);scene.add(hole);
 views.push({element,scene,camera,controls,hole});
});
function frame(now){requestAnimationFrame(frame);for(const v of views){const r=v.element.getBoundingClientRect();v.camera.aspect=r.width/r.height;v.camera.updateProjectionMatrix();v.controls.update();updateObjectVisual(v.hole,0,v.camera);renderer.setViewport(r.left,innerHeight-r.bottom,r.width,r.height);renderer.setScissor(r.left,innerHeight-r.bottom,r.width,r.height);optical.render(v.scene,v.camera)}frames++;if(now-last>1000){status.textContent=`렌더링 오류 ${errors}개 · ${Math.round(frames*1000/(now-last))} fps (4개 시점)`;last=now;frames=0}}requestAnimationFrame(frame);
addEventListener('resize',()=>renderer.setSize(innerWidth,innerHeight));
</script></html>
